[package]
name = "dedent-paste"
version = "0.3.0"
edition = "2024"
authors = ["Will 保哥"]
license = "MIT"
repository = "https://github.com/doggy8088/dedent-paste"

[dependencies]
base64 = "0.23"
serde_json = "1"
ureq = "3.4"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"





